<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Karaokê</title>
  <style>
    body {
      background-color: #121212;
      color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h2 {
      margin-top: 0;
    }
    input {
      padding: 8px;
      margin: 10px 0;
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    iframe {
      margin-top: 20px;
      display: none;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    #playlistQueue {
      margin-top: 30px;
      max-width: 600px;
    }
    #playlistQueue ul {
      list-style-type: decimal;
      padding-left: 20px;
    }
    .remove-btn {
      margin-left: 10px;
      cursor: pointer;
      color: #ff4d4d;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>🎛️ Painel do Host - Adicionar música</h2>
  <label for="singerName">Nome do cantor(a):</label>
  <input type="text" id="singerName" placeholder="Ex: Thomas" />

  <label for="youtubeUrl">Link do vídeo no YouTube:</label>
  <input type="text" id="youtubeUrl" placeholder="Cole o link do YouTube" oninput="previewVideo()" />

  <button id="addButton" onclick="addToPlaylist()" disabled>Adicionar à fila</button>

  <iframe id="videoPreview" width="400" height="225" frameborder="0" allowfullscreen></iframe>

  <div id="playlistQueue">
    <h3>🎵 Fila atual</h3>
    <ul id="queueList"></ul>
    <button onclick="clearPlaylist()">🗑️ Limpar fila inteira</button>
  </div>

  <script>
    const apiKey = "AIzaSyAhM3a37WNWD2j7GbnJ4t43XlN8JIqhjXU";

    function extractVideoID(url) {
      const match = url.match(/(?:v=|\\/)([0-9A-Za-z_-]{11})/);
      return match ? match[1] : null;
    }

    function previewVideo() {
      const url = document.getElementById("youtubeUrl").value;
      const videoId = extractVideoID(url);
      const iframe = document.getElementById("videoPreview");
      const button = document.getElementById("addButton");

      if (videoId) {
        iframe.src = "https://www.youtube.com/embed/" + videoId;
        iframe.style.display = "block";
        button.disabled = false;
      } else {
        iframe.src = "";
        iframe.style.display = "none";
        button.disabled = true;
      }
    }

    function getPlaylist() {
      try {
        return JSON.parse(localStorage.getItem('karaokePlaylist') || '[]');
      } catch (e) {
        return [];
      }
    }

    function savePlaylist(list) {
      localStorage.setItem('karaokePlaylist', JSON.stringify(list));
      updateQueueDisplay();
    }

    function addToPlaylist() {
      const name = document.getElementById("singerName").value.trim();
      const url = document.getElementById("youtubeUrl").value.trim();
      const videoId = extractVideoID(url);
      if (!videoId) {
        alert("Link inválido.");
        return;
      }

      const playlist = getPlaylist();
      playlist.push({ id: videoId, singer: name || "Sem nome" });
      savePlaylist(playlist);
      alert("Adicionado com sucesso!");
      document.getElementById("youtubeUrl").value = "";
      document.getElementById("singerName").value = "";
      previewVideo();
    }

    function removeItem(index) {
      const playlist = getPlaylist();
      playlist.splice(index, 1);
      savePlaylist(playlist);
    }

    function clearPlaylist() {
      if (confirm("Tem certeza que deseja apagar toda a fila?")) {
        localStorage.removeItem('karaokePlaylist');
        updateQueueDisplay();
      }
    }

    function updateQueueDisplay() {
      const ul = document.getElementById("queueList");
      ul.innerHTML = "";
      const list = getPlaylist();

      if (!list.length) {
        const li = document.createElement("li");
        li.textContent = "Fila vazia.";
        ul.appendChild(li);
        return;
      }

      list.forEach((item, index) => {
        const li = document.createElement("li");
        li.textContent = "Carregando...";
        ul.appendChild(li);

        fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${item.id}&key=${apiKey}`)
          .then(res => res.json())
          .then(data => {
            const title = data.items[0]?.snippet?.title || "(sem título)";
            li.textContent = `${item.singer}: ${title}`;
            const btn = document.createElement("span");
            btn.textContent = "❌";
            btn.className = "remove-btn";
            btn.onclick = () => removeItem(index);
            li.appendChild(btn);
          })
          .catch(() => {
            li.textContent = `${item.singer}: (erro ao carregar título)`;
          });
      });
    }

    updateQueueDisplay();
  </script>
</body>
</html>
