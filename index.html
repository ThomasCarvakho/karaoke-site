<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Karaokê ao Vivo</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      background-color: #121212;
      color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1e1e1e;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    header h2 {
      margin: 0;
      font-size: 24px;
    }
    #playerContainer {
      display: flex;
      gap: 30px;
      padding: 20px;
    }
    #queue {
      max-width: 400px;
      border-left: 2px solid #333;
      padding-left: 20px;
    }
    #queue h3 {
      margin-top: 0;
    }
    #queue ul {
      list-style-type: decimal;
      padding-left: 20px;
    }
    .remove-btn {
      margin-left: 10px;
      cursor: pointer;
      color: #ff4d4d;
      font-weight: bold;
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #555;
    }
    audio {
      width: 300px;
      margin-left: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h2>🎤 Karaokê ao Vivo</h2>
  </header>

  <div id="playerContainer">
    <div>
      <div id="player"></div>
      <button onclick="skipSong()">⏭️ Pular Música</button>
    </div>
    <div id="queue">
      <h3>🎵 Próximas músicas</h3>
      <ul id="playlistQueue"></ul>
      <button onclick="clearPlaylist()">🗑️ Limpar toda a fila</button>
    </div>
  </div>

  <p id="status" style="color:#ff4d4d; padding-left:20px;"></p>

  <div style="padding-left: 20px;">
    <h3>🎶 Música ambiente</h3>
    <audio id="ambientPlayer" loop controls autoplay>
      <source src="Melodic.mp3" type="audio/mpeg">
      Seu navegador não suporta áudio.
    </audio>
    <p id="ambientWarning" style="color:orange; display:none;">
      ⚠️ A reprodução automática foi bloqueada. Clique no botão abaixo para ativar a música ambiente:
    </p>
    <button id="playAmbientBtn" onclick="tryPlayAmbient()" style="display:none;">
      ▶️ Ativar Música Ambiente
    </button>
  </div>

  <script>
    let playlist = [];
    let current = 0;
    let player;
    let previousRaw = "";
    const apiKey = "AIzaSyAhM3a37WNWD2j7GbnJ4t43XlN8JIqhjXU";
    const ambientAudio = document.getElementById("ambientPlayer");

    function getValidPlaylist(rawList) {
      const list = [];
      try {
        const parsed = JSON.parse(rawList);
        for (const item of parsed) {
          if (typeof item === 'object' && item.id && item.singer) {
            list.push(item);
          }
        }
      } catch (e) {
        console.error("Erro ao validar playlist:", e);
      }
      return list;
    }

    function savePlaylist(newList) {
      localStorage.setItem('karaokePlaylist', JSON.stringify(newList));
      previousRaw = JSON.stringify(newList);
    }

    function removeItem(index) {
      playlist.splice(index + current, 1);
      savePlaylist(playlist);
      updateQueueDisplay();
      checkAmbientAudio();
    }

    function clearPlaylist() {
      if (confirm("Tem certeza que deseja limpar toda a fila?")) {
        localStorage.removeItem('karaokePlaylist');
        location.reload();
      }
    }

    function updateQueueDisplay() {
      const ul = document.getElementById("playlistQueue");
      ul.innerHTML = "";

      if (!playlist.length || current >= playlist.length) {
        const li = document.createElement("li");
        li.textContent = "Nenhuma música na fila.";
        ul.appendChild(li);
      } else {
        playlist.forEach((item, i) => {
          if (i < current) return;
          const li = document.createElement("li");
          li.textContent = "Carregando...";

          fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${item.id}&key=${apiKey}`)
            .then(response => response.json())
            .then(data => {
              const title = data.items[0]?.snippet?.title || "(sem título)";
              li.textContent = `${item.singer}: ${title}`;
              const rm = document.createElement("span");
              rm.textContent = "❌";
              rm.className = "remove-btn";
              rm.onclick = () => removeItem(i - current);
              li.appendChild(rm);
            })
            .catch(() => {
              li.textContent = `${item.singer}: (erro ao carregar título)`;
            });

          ul.appendChild(li);
        });
      }
    }

    function loadNextVideo() {
      if (current >= playlist.length) {
        document.getElementById('status').innerText = 'Nenhuma música na fila.';
        checkAmbientAudio(true);
        return;
      }
      const videoId = playlist[current].id;
      player.loadVideoById(videoId);
      current++;
      updateQueueDisplay();
      checkAmbientAudio(false);
    }

    function skipSong() {
      loadNextVideo();
    }

    function tryPlayAmbient() {
      ambientAudio.play()
        .then(() => {
          document.getElementById("ambientWarning").style.display = "none";
          document.getElementById("playAmbientBtn").style.display = "none";
        })
        .catch(() => {
          document.getElementById("ambientWarning").style.display = "block";
          document.getElementById("playAmbientBtn").style.display = "block";
        });
    }

    function checkAmbientAudio(shouldPlay = false) {
      if (shouldPlay) {
        ambientAudio.style.display = "block";
        ambientAudio.play()
          .then(() => {
            document.getElementById("ambientWarning").style.display = "none";
            document.getElementById("playAmbientBtn").style.display = "none";
          })
          .catch(() => {
            document.getElementById("ambientWarning").style.display = "block";
            document.getElementById("playAmbientBtn").style.display = "block";
          });
      } else {
        ambientAudio.pause();
        ambientAudio.style.display = "block";
        document.getElementById("ambientWarning").style.display = "none";
        document.getElementById("playAmbientBtn").style.display = "none";
      }
    }

    function onYouTubeIframeAPIReady() {
      const raw = localStorage.getItem('karaokePlaylist') || '[]';
      playlist = getValidPlaylist(raw);
      if (!playlist.length) {
        document.getElementById('status').innerText = 'Nenhuma música na playlist.';
        checkAmbientAudio(true);
        return;
      }

      player = new YT.Player('player', {
        height: '360',
        width: '640',
        events: {
          'onReady': () => {
            player.cueVideoById(playlist[0].id);
            current = 1;
            updateQueueDisplay();
            checkAmbientAudio(false);
          },
          'onStateChange': (event) => {
            if (event.data === YT.PlayerState.ENDED) {
              loadNextVideo();
            }
          }
        }
      });
    }

    let lastSkip = 0;
function checkSkipRequest() {
  const skipTimestamp = parseInt(localStorage.getItem("karaokeSkipRequest") || "0");
  if (skipTimestamp > lastSkip) {
    lastSkip = skipTimestamp;
    skipSong();
  }
}

function checkForUpdates() {
      const raw = localStorage.getItem('karaokePlaylist') || '[]';
      if (raw !== previousRaw) {
        playlist = getValidPlaylist(raw);
        updateQueueDisplay();
        checkAmbientAudio(current >= playlist.length);
        previousRaw = raw;
      }
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    setInterval(() => {
  checkForUpdates();
  checkSkipRequest();
}, 3000);
  </script>
</body>
</html>
