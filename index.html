<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Karaokê - Playlist</title>
  <style>
    #playerContainer {
      display: flex;
      gap: 30px;
    }
    #queue {
      max-width: 400px;
      border-left: 2px solid #ccc;
      padding-left: 20px;
    }
    #queue h3 {
      margin-top: 0;
    }
    #queue ul {
      list-style-type: decimal;
      padding-left: 20px;
    }
  </style>
</head>
<body>
  <h2>🎤 Karaokê ao vivo</h2>
  <div id="playerContainer">
    <div id="player"></div>
    <div id="queue">
      <h3>🎵 Próximas músicas</h3>
      <ul id="playlistQueue"></ul>
    </div>
  </div>
  <p id="status" style="color:red;"></p>

  <h3>🎶 Música ambiente</h3>
  <audio controls loop autoplay>
    <source src="Melodic.mp3" type="audio/mpeg">
    Seu navegador não suporta áudio.
  </audio>

  <script>
    let playlist = [];
    let current = 0;
    let player;
    let previousRaw = "";
    const apiKey = "AIzaSyAhM3a37WNWD2j7GbnJ4t43XlN8JIqhjXU";
    const titleCache = {};

    function updateQueueDisplay() {
      const ul = document.getElementById("playlistQueue");
      ul.innerHTML = "";

      if (!playlist.length || current >= playlist.length) {
        const li = document.createElement("li");
        li.textContent = "Nenhuma música na fila.";
        ul.appendChild(li);
        return;
      }

      for (let i = current; i < playlist.length; i++) {
        const item = playlist[i];
        const li = document.createElement("li");
        li.textContent = "Carregando...";

        fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${item.id}&key=${apiKey}`)
          .then(response => response.json())
          .then(data => {
            const title = data.items[0]?.snippet?.title || "(sem título)";
            li.textContent = `${item.singer}: ${title}`;
          })
          .catch(() => {
            li.textContent = `${item.singer}: (erro ao carregar título)`;
          });

        ul.appendChild(li);
      }
    }

    function loadNextVideo() {
      if (current >= playlist.length) {
        document.getElementById('status').innerText = 'Fim da playlist ou nenhuma música foi adicionada ainda.';
        return;
      }
      const videoId = playlist[current].id;
      player.loadVideoById(videoId);
      current++;
      updateQueueDisplay();
    }

    function onYouTubeIframeAPIReady() {
      playlist = JSON.parse(localStorage.getItem('karaokePlaylist') || '[]');
      if (!playlist.length) {
        document.getElementById('status').innerText = 'Nenhuma música na playlist. Acesse a página secreta para adicionar.';
        return;
      }

      player = new YT.Player('player', {
        height: '360',
        width: '640',
        events: {
          'onReady': () => {
            player.cueVideoById(playlist[0].id);
            current = 1;
            updateQueueDisplay();
          },
          'onStateChange': (event) => {
            if (event.data === YT.PlayerState.ENDED) {
              loadNextVideo();
            }
          }
        }
      });
    }

    function checkForUpdates() {
      const raw = localStorage.getItem('karaokePlaylist') || '[]';
      if (raw !== previousRaw) {
        previousRaw = raw;
        playlist = JSON.parse(raw);
        updateQueueDisplay();
      }
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    setInterval(checkForUpdates, 3000);
  </script>
</body>
</html>
